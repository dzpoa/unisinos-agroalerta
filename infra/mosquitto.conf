# Broker local (rede do simulador, ingestor e motor de alertas).
listener 1883
allow_anonymous true
persistence false

# Ponte com um broker público (test.mosquitto.org), usado pelo ESP32 simulado no Wokwi
# (o Wokwi não alcança o localhost). O prefixo deve ser igual ao MQTT_PREFIXO do .env
# e ao PREFIXO do firmware. Alternativa se o test.mosquitto.org estiver fora do ar:
# broker.emqx.io:1883 (trocar também MQTT_HOST no firmware).
connection broker-publico
address test.mosquitto.org:1883
cleansession true
try_private false
start_type automatic
topic unisinos-agroalerta/leituras/wokwi/# in 1
topic unisinos-agroalerta/risco/# out 1
topic unisinos-agroalerta/alertas/# out 1
